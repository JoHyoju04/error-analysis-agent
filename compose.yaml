# Socket Mode 이므로 외부로 공개하는 포트가 없다.
#
#   docker compose build
#   docker compose run --rm login        # 최초 1회 ChatGPT 인증
#   docker compose run --rm selfcheck    # 설정 점검
#   docker compose up -d                 # 봇 실행

x-bot-base: &bot-base
  build: .
  image: error-analysis-agent:0.1.0
  env_file: .env
  environment:
    # 컨테이너 안의 고정 경로. .env 의 값보다 우선하도록 여기서 지정한다.
    CODEX_HOME: /home/bot/.codex
    CONFIG_PATH: /app/config.yaml
    ANALYSIS_SNAPSHOT_ROOT: /workspace/snapshots
    ANALYSIS_AGENTS_MD_TEMPLATE: /app/prompts/AGENTS.analysis.md
    STATE_DB_PATH: /workspace/state/jobs.sqlite3
  volumes:
    # ChatGPT OAuth 세션. 이 볼륨 하나만이 인증의 소유 경로다.
    # 같은 경로를 여러 호스트/프로세스에서 동시에 갱신하지 않는다.
    - ./state/codex:/home/bot/.codex
    # 중복 실행 방지용 SQLite
    - ./state/data:/workspace/state
    # 분석 대상 Git 저장소(bot 이 fetch 하므로 쓰기 가능).
    # 호스트에서 미리 준비하는 운영 구성에서는 `:ro` 로 바꾸고
    # .env 에서 ANALYSIS_ALLOW_FETCH=false 로 설정한다.
    - ./repos:/workspace/repos
    # 요청별 읽기 전용 소스 스냅샷이 만들어지는 곳
    - ./state/snapshots:/workspace/snapshots
    # 실제 Sentry 프로젝트 ↔ Git 저장소 매핑. 저장소에 commit 되는 config.yaml 은
    # 예제이므로, `cp config.yaml config.local.yaml` 로 만든 로컬 파일을 올린다.
    - ./config.local.yaml:/app/config.yaml:ro
    - ./prompts:/app/prompts:ro
  security_opt:
    - no-new-privileges:true

services:
  bot:
    <<: *bot-base
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    cpus: 2.0
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 최초 ChatGPT Device Code 로그인 (사람이 URL 을 열어 승인해야 한다).
  # bot 과 동일한 이미지/사용자/CODEX_HOME 볼륨을 사용한다.
  login:
    <<: *bot-base
    profiles: ["tools"]
    restart: "no"
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    command: ["python", "-m", "error_analysis_agent.login"]

  # Slack/Sentry/Git/Codex 설정 점검 (읽기 전용)
  selfcheck:
    <<: *bot-base
    profiles: ["tools"]
    restart: "no"
    healthcheck:
      disable: true
    command: ["python", "-m", "error_analysis_agent.selfcheck"]
