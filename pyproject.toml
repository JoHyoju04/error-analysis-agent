[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "error-analysis-agent"
version = "0.1.0"
description = "Slack-triggered, read-only error analysis agent that reads the revision deployed at incident time (Sentry adapter included)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Versions are pinned on purpose: the Codex SDK moves fast and its public API
# is verified against this exact release (see README "Codex SDK API 검증").
dependencies = [
    "openai-codex==0.163.0",
    "slack-bolt>=1.21,<2",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
error-analysis-agent = "error_analysis_agent.main:main"
error-analysis-agent-login = "error_analysis_agent.login:main"
error-analysis-agent-selfcheck = "error_analysis_agent.selfcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
